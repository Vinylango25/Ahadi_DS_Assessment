name: ahadi-analytics
channels:
  - conda-forge
  - defaults

dependencies:
  # ── Python ─────────────────────────────────────────────────
  - python=3.11.9

  # ── Geospatial (best installed via conda-forge) ─────────────
  - gdal=3.10.0
  - rasterio=1.4.3
  - geopandas=1.0.1
  - shapely=2.0.6
  - pyproj=3.7.0
  - fiona=1.10.1

  # ── Data science ────────────────────────────────────────────
  - numpy=2.2.0
  - pandas=2.2.3
  - scipy=1.15.0

  # ── Visualization ────────────────────────────────────────────
  - matplotlib=3.10.0
  - seaborn=0.13.2

  # ── Networking ──────────────────────────────────────────────
  - requests=2.32.3
  - tqdm=4.67.1

  # ── pip-only packages ───────────────────────────────────────
  - pip
  - pip:
    - fastapi==0.115.6
    - uvicorn[standard]==0.32.1
    - sqlalchemy==2.0.36
    - aiosqlite==0.20.0
    - pydantic==2.10.3
    - pydantic-settings==2.6.1
    - plotly==5.24.1
    - python-multipart==0.0.12
    - httpx==0.28.1
    - python-dotenv==1.0.1
    - click==8.1.8
    - loguru==0.7.3
    - pytest==8.3.4
    - pytest-asyncio==0.24.0
    - pytest-cov==6.0.0
    - aiohttp==3.11.11
