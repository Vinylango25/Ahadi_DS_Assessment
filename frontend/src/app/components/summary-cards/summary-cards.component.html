<div class="cards-grid">
  @for (card of cards(); track trackById($index, card)) {
    <div class="metric-card card-glass" [class]="card.accentClass">
      <div class="card-icon-wrap">
        <span class="material-symbols-rounded card-icon">{{ card.icon }}</span>
      </div>
      <div class="card-body">
        <div class="card-value-row">
          <span class="card-value">{{ card.formatted }}</span>
          @if (card.unit) {
            <span class="card-unit">{{ card.unit }}</span>
          }
        </div>
        <div class="card-label">{{ card.label }}</div>
        <div class="card-description">{{ card.description }}</div>
      </div>
    </div>
  }
</div>
