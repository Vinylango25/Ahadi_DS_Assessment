<div class="interpretation-panel card">

  <div class="panel-header">
    <h2 class="panel-title">
      <span class="material-symbols-rounded">insights</span>
      Analysis &amp; Context
    </h2>
    @if (countyName) {
      <span class="panel-badge primary">{{ countyName }}</span>
    }
  </div>

  <div class="sections-list">
    @for (section of sections(); track trackById($index, section)) {
      <div class="section" [class.open]="section.open">

        <!-- Section Header (clickable) -->
        <button
          class="section-header"
          (click)="toggleSection(section.id)"
          [attr.aria-expanded]="section.open"
          [attr.aria-controls]="'section-' + section.id"
        >
          <span class="section-icon-wrap">
            <span class="material-symbols-rounded section-icon">{{ section.icon }}</span>
          </span>
          <span class="section-title">{{ section.title }}</span>
          <span class="chevron material-symbols-rounded">
            {{ section.open ? 'expand_less' : 'expand_more' }}
          </span>
        </button>

        <!-- Section Body (collapsible) -->
        <div
          class="section-body"
          [id]="'section-' + section.id"
          [attr.aria-hidden]="!section.open"
        >
          @for (line of section.content; track $index) {
            <p class="section-line">{{ line }}</p>
          }
        </div>

      </div>
    }
  </div>

</div>
